<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8f1f35">
  <title>Razones por las que te amo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--red:#98263b;--dark:#691426;--pink:#bc637a;--paper:#fffaf3;--ink:#923d56}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"DM Sans",sans-serif;color:#512733;background:#fff}
    button{font:inherit}.app{min-height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:22px clamp(12px,4vw,56px) 16px;position:relative;background:radial-gradient(circle at 10% 20%,#f7dce34d 0 2px,transparent 3px),radial-gradient(circle at 90% 72%,#d98da02b 0 2px,transparent 3px),linear-gradient(140deg,#fff,#fffafb 50%,#fff)}
    .ambient{position:absolute;inset:0;pointer-events:none;color:#dc9cad33;font-size:20px}.ambient span{position:absolute;animation:float 8s ease-in-out infinite}.ambient span:nth-child(1){left:4%;top:25%}.ambient span:nth-child(2){right:5%;top:30%;animation-delay:-2s}.ambient span:nth-child(3){left:8%;bottom:16%;animation-delay:-4s}.ambient span:nth-child(4){right:10%;bottom:13%;animation-delay:-6s}.ambient span:nth-child(5){left:48%;top:3%;font-size:11px}.ambient span:nth-child(6){right:28%;top:7%;font-size:13px;animation-delay:-3s}@keyframes float{50%{transform:translateY(-13px) rotate(9deg)}}
    header{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;z-index:3}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--red);box-shadow:0 7px 20px #7e182c38}.heading small{display:block;margin-bottom:3px;color:#aa6d7c;font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}.heading h1{margin:0;color:var(--dark);font:italic 600 clamp(23px,3vw,34px)/.95 "Cormorant Garamond",serif}
    .stage{width:min(1240px,100%);min-height:600px;margin:auto;display:grid;grid-template-columns:60px minmax(0,1fr) 60px;align-items:center;perspective:1900px;z-index:2}.book{justify-self:center;width:min(100%,1020px);aspect-ratio:1.72/1;position:relative;transform-style:preserve-3d}.shadow{position:absolute;z-index:-2;left:5%;right:5%;bottom:-27px;height:52px;border-radius:50%;background:#4a16233d;filter:blur(22px);transition:.6s}
    .cover{position:absolute;z-index:5;inset:0 24%;padding:15px;border-radius:6px 18px 18px 6px;color:#ffe8ed;background:linear-gradient(90deg,#3e051352,transparent 7%,transparent 94%,#3a051240),linear-gradient(135deg,#a52941,#891c34 55%,#721228);box-shadow:inset 7px 0 10px #ffffff14,inset -5px 0 12px #28000a4d,0 24px 55px #55111f4d;transform-origin:left center;backface-visibility:hidden;transition:transform .75s cubic-bezier(.45,.03,.2,1),opacity .25s .4s}.cover:before{content:"";position:absolute;top:0;left:12px;bottom:0;width:6px;border-left:1px solid #ffffff2e;border-right:1px solid #2d000a40}.cover-inner{height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px;text-align:center;border:1px solid #ffdee573;border-radius:4px 12px 12px 4px}.cover-inner:after{content:"";position:absolute;inset:7px;border:1px solid #ffdee52b;border-radius:2px 8px 8px 2px}.cover p{margin:0 0 18px;font-size:clamp(8px,1vw,11px);letter-spacing:.28em;text-transform:uppercase}.cover h2{max-width:340px;margin:0;font:italic 500 clamp(40px,5.5vw,70px)/.9 "Cormorant Garamond",serif;text-wrap:balance}.divider{width:145px;margin:24px 0 17px;display:flex;align-items:center;gap:8px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:currentColor;opacity:.48}.cover-note{font:italic 17px "Cormorant Garamond",serif}.cover-heart{position:absolute;font-size:24px;opacity:.55}.cover-heart.one{top:24px;left:25px;transform:rotate(-14deg)}.cover-heart.two{right:25px;bottom:24px;transform:rotate(15deg)}
    .spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 8px 1fr;border-radius:8px 16px 16px 8px;opacity:0;transform:scaleX(.55);transition:opacity .35s .28s,transform .65s cubic-bezier(.45,.03,.2,1)}.open .cover{transform:rotateY(-178deg);opacity:0;pointer-events:none}.open .spread{opacity:1;transform:scaleX(1)}.closed .spread{pointer-events:none}.closed .shadow{left:24%;right:24%}
    .paper{position:relative;min-width:0;overflow:hidden;padding:clamp(27px,4vw,60px);background:repeating-linear-gradient(0deg,#905c3d05 0 1px,transparent 1px 4px),linear-gradient(135deg,#fffdf8,var(--paper));box-shadow:inset 0 0 35px #70472d14}.paper:before{content:"";position:absolute;inset:9px;border:1px solid #c38f7f2e;pointer-events:none}.left{border-radius:7px 0 0 12px;box-shadow:inset -18px 0 26px -24px #3b141ca6,-3px 5px 0 #eee2d7}.right{border-radius:0 13px 13px 0;box-shadow:inset 18px 0 26px -24px #3b141ca6,3px 5px 0 #eee2d7}.spine{z-index:2;background:linear-gradient(90deg,#46141f2e,#ffffffa6 46%,#46141f29);box-shadow:0 0 14px #41111d40}
    .kicker{margin:12% 0 15px;color:#c17a8c;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}.reason{width:100%;min-height:62%;margin:0;display:flex;align-items:center;color:var(--ink);font:italic 600 46px/1.12 "Cormorant Garamond",serif;text-wrap:balance}.mini-heart{position:absolute;top:32px;right:34px;width:32px;height:32px;display:grid;place-items:center;border:1px solid #e3abb9;border-radius:50%;color:#ca7289}.hearts{position:absolute;right:34px;bottom:26px;color:#d98ba090;letter-spacing:-2px;transform:rotate(-6deg)}
    .photo-frame{height:100%;margin:0;position:relative;padding:clamp(12px,1.5vw,18px);background:#fff;box-shadow:0 12px 32px #532a2230;transform:rotate(1.1deg)}.photo-frame img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.92) contrast(.97);background:#f2e8e5}.missing{width:100%;height:100%;display:grid;place-items:center;color:#d899a999;font-size:50px;background:#f8e9e8}.tape{position:absolute;z-index:2;top:-12px;width:70px;height:29px;background:#e5b9bf9e}.tape.a{left:-18px;transform:rotate(-35deg)}.tape.b{right:-18px;transform:rotate(34deg)}
    .nav{position:relative;z-index:8;width:50px;height:50px;cursor:pointer;display:grid;place-items:center;border:1px solid #efd1d9;border-radius:50%;color:var(--dark);font-size:23px;background:#ffffffe8;box-shadow:0 8px 24px #661d2f1f;transition:.2s}.nav:not(:disabled):hover{transform:scale(1.08);color:#fff;background:var(--red)}.nav:disabled{cursor:default;opacity:.22}.turn-next .spread{animation:next .55s ease}.turn-prev .spread{animation:prev .55s ease}@keyframes next{50%{transform:perspective(1400px) rotateY(-3deg) scale(.992);filter:brightness(.92)}}@keyframes prev{50%{transform:perspective(1400px) rotateY(3deg) scale(.992);filter:brightness(.92)}}
    footer{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;z-index:3;color:#9d6f7b;font-size:10px;letter-spacing:.08em}footer p{margin:0}.dots{height:8px;display:flex;align-items:center;gap:5px}.dots span{width:4px;height:4px;border-radius:50%;background:#e6c7cf}.dots span.active{width:14px;border-radius:8px;background:var(--pink)}
    @media(max-width:700px){.app{padding-top:14px;overflow-y:auto}header{grid-template-columns:auto 1fr}.stage{min-height:680px;grid-template-columns:40px minmax(0,1fr) 40px}.nav{width:38px;height:38px}.book{width:100%;height:600px;aspect-ratio:auto}.cover{inset:4% 8%}.cover h2{font-size:clamp(46px,13vw,66px)}.spread{inset:0 1%;grid-template-columns:1fr;grid-template-rows:1fr 7px 1fr}.spine{height:7px;background:linear-gradient(0deg,#46141f29,#ffffffa6,#46141f26)}.paper{padding:27px 29px}.left{border-radius:10px 10px 0 0}.right{border-radius:0 0 10px 10px;padding:21px 31px 31px}.kicker{margin:0 0 8px}.reason{min-height:68%}.mini-heart{top:22px;right:27px}.photo-frame{transform:rotate(.5deg)}footer .hint{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <div class="ambient" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
    <header>
      <div class="mark">♥</div>
      <div class="heading"><small>Nuestro pequeño cuaderno</small><h1>Razones por las que te amo</h1></div>
    </header>

    <section class="stage" aria-label="Cuadernillo de recuerdos">
      <button class="nav" id="prev" aria-label="Página anterior">←</button>
      <div class="book closed" id="book">
        <div class="shadow"></div>
        <article class="cover">
          <div class="cover-inner"><span class="cover-heart one">♥</span><p>Un recuerdo para ti</p><h2>Razones por las que te amo</h2><div class="divider">♥</div><span class="cover-note">Hecho con cariño</span><span class="cover-heart two">♥</span></div>
        </article>
        <div class="spread">
          <article class="paper left">
            <span class="mini-heart">♥</span><p class="kicker">Una razón más...</p>
            <p id="reason" class="reason"></p><span class="hearts">♥ ♥ ♥</span>
          </article>
          <div class="spine"></div>
          <article class="paper right" id="photoPage"></article>
        </div>
      </div>
      <button class="nav" id="next" aria-label="Abrir o avanzar">→</button>
    </section>

    <footer><p id="counter">Toca la flecha para abrir</p><div class="dots" id="dots"></div><p class="hint">También puedes usar las teclas ← →</p></footer>
  </main>

  <script>
    const reasons=["Amo la forma en que haces que los días comunes se sientan especiales.","Amo tu manera de escucharme y de estar presente en cada momento.","Amo todos los pequeños momentos que pasas a mi lado.","Amo tu sonrisa y la alegría que veo en tus ojos cuando me ves","Amo poder ser como soy cuando estoy con vos.","Amo tu forma de ser y divertirte.","Amo tus chistes y tus juegos.","Amo como me abrazas y me abrazas.","Amo tu carita, tu cabello, tus labios.","Amo la manera en la cual sos vos misma.","Amo como te esforzas sin rendirte.","Amo que nos apoyemos en cada meta, en cada logro.","Amo como me cuidas y mimas.","Amo como el estres, y todo lo malo se va cuando estoy con vos.","Amo todo tu ser."];
    const extensions=["jpg","jpeg","png","webp","avif"];
    const book=document.querySelector("#book"),prev=document.querySelector("#prev"),next=document.querySelector("#next"),reason=document.querySelector("#reason"),photoPage=document.querySelector("#photoPage"),counter=document.querySelector("#counter"),dots=document.querySelector("#dots");
    let page=0,isOpen=false,isTurning=false;
    function reasonSize(text){if(text.length>65)return "clamp(25px,2.8vw,40px)";if(text.length>48)return "clamp(28px,3vw,43px)";return "clamp(31px,3.25vw,47px)"}
    function photoMarkup(number,extensionIndex=0){return `<figure class="photo-frame"><span class="tape a"></span><span class="tape b"></span><img id="memoryPhoto" src="fotos/foto ${number}.${extensions[extensionIndex]}" alt="Fotografía ${number}" data-extension="${extensionIndex}"></figure>`}
    function bindPhotoFallback(){const img=document.querySelector("#memoryPhoto");if(!img)return;img.addEventListener("error",()=>{const nextExtension=Number(img.dataset.extension)+1;if(nextExtension<extensions.length){photoPage.innerHTML=photoMarkup(page+1,nextExtension);bindPhotoFallback()}else{photoPage.innerHTML=`<figure class="photo-frame"><span class="tape a"></span><span class="tape b"></span><div class="missing">♥</div></figure>`}})}
    function render(){book.classList.toggle("open",isOpen);book.classList.toggle("closed",!isOpen);prev.disabled=!isOpen||isTurning;next.disabled=(isOpen&&page>=reasons.length-1)||isTurning;reason.textContent=reasons[page];reason.style.fontSize=reasonSize(reasons[page]);photoPage.innerHTML=photoMarkup(page+1);bindPhotoFallback();counter.textContent=isOpen?`${page+1} / ${reasons.length}`:"Toca la flecha para abrir";dots.innerHTML=reasons.map((_,i)=>`<span class="${i===page&&isOpen?"active":""}"></span>`).join("")}
    function turn(direction){if(isTurning)return;if(direction==="next"){if(!isOpen){isOpen=true;isTurning=true;book.classList.add("turn-next");render();setTimeout(done,580);return}if(page>=reasons.length-1)return;animate("next",()=>page++)}else{if(!isOpen)return;if(page===0){isOpen=false;isTurning=true;book.classList.add("turn-prev");render();setTimeout(done,580);return}animate("prev",()=>page--)}}
    function animate(direction,change){isTurning=true;book.classList.add("turn-"+direction);render();setTimeout(()=>{change();done()},260)}
    function done(){isTurning=false;book.classList.remove("turn-next","turn-prev");render()}
    prev.addEventListener("click",()=>turn("prev"));next.addEventListener("click",()=>turn("next"));window.addEventListener("keydown",event=>{if(event.key==="ArrowLeft")turn("prev");if(event.key==="ArrowRight")turn("next")});render();
  </script>
</body>
</html>
